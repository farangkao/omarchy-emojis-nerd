name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned: ubuntu-latest began its staged migration to Ubuntu 26 on
    # 2026-10-19 (actions/runner-images#14748), which would flip the image
    # under a green CI without notice.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends jq

      - name: Validate manifest
        run: jq empty manifest.json

      - name: Run search tests
        run: tests/emoji-search-test.sh

      - name: Run dataset tests
        run: tests/dataset-test.sh

      - name: Run insert helper tests
        run: tests/insert-test.sh
